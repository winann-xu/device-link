# ============================================================
# DEVICE LINK 默认配置文件
# 首次运行自动生成，所有路径相对于 exe 所在目录
# 修改后自动热加载（约 2 秒延迟），无需重启
# ============================================================

app:
  name: "DEVICE LINK"
  version: "1.0.11"
  language: "zh-CN"
  start_minimized: true
  minimize_to_tray: true
  single_instance: true

monitor:
  default_interval_seconds: 30
  default_timeout_ms: 3000
  default_failure_threshold: 3
  default_recovery_threshold: 2
  max_workers: 50
  # 单轮调度最多提交的探测任务数（上限 = max_workers），
  # 防止启动/批量导入后上千台设备同刻涌入线程池与数据库写锁
  max_submit_per_tick: 50
  jitter_schedule: true

watchdog:
  enabled: true
  heartbeat_interval_seconds: 5
  heartbeat_timeout_seconds: 15
  max_restart_attempts: 3
  restart_cooldown_seconds: 30
  # 主进程稳定运行超过该时长后，看门狗将重启计数复位（跨崩溃轮次）
  healthy_threshold_seconds: 300

notify:
  digest:
    enabled: true
    window_seconds: 300
    max_events_per_digest: 50
    send_immediate_if_critical: true
  daily_report:
    enabled: false
    send_time: "08:00"
  email:
    smtp_host: ""
    smtp_port: 465
    smtp_user: ""
    smtp_password: ""
    use_ssl: true
    sender_name: "DEVICE LINK"
    recipients: []
    enabled: false
  feishu:
    webhook_url: ""
    enabled: false
  wecom:
    webhook_url: ""
    enabled: false
  retry_count: 3
  retry_backoff_base_seconds: 5
  cooldown_seconds: 1800
  escalation_enabled: true
  escalation_minutes: 15
  escalation_max_count: 3
  escalation_channels: ["all"]

storage:
  engine: "sqlite"
  path: "./data/device-link.db"
  # 历史记录保留天数（超出部分由后台清理线程自动删除）
  history_retention_days: 30
  # 历史数据自动清理（v1.0.11）：防止 data/ 目录与历史统计查询随时间膨胀
  cleanup:
    # 总开关
    enabled: true
    # 保留天数（优先于上方的 history_retention_days）
    retention_days: 30
    # 清理周期（分钟）：启动时会立即执行一轮
    interval_minutes: 60
    # 单批删除行数 + 批间休眠（毫秒）：每批结束即释放写锁，探测落库不被长时间阻塞
    batch_size: 5000
    batch_sleep_ms: 50
    # 单轮最多删除行数（防止积压库首次清理长时间占用）
    max_rows_per_run: 2000000
    # 同步清理超过保留期且【已确认】的告警事件（未确认的保留，避免影响升级逻辑）
    alert_events_enabled: true
    # 历史统计日汇总表（status_daily）：历史页在线率/排行榜的数据源
    daily_stats_enabled: true
    # 非首次回填时只重算最近 N 天（修复旧版本运行期间漏记的计数）
    daily_stats_rebuild_days: 2
    # 清理后是否 VACUUM 回收磁盘（需独占，会短暂暂停探测，默认关闭；
    # 平时可手动执行: DEVICE-LINK.exe --vacuum-now）
    vacuum_enabled: false
    # 空闲页占比超过该值才值得 VACUUM（配合 vacuum_enabled）
    vacuum_freelist_percent: 20
    # 清理后执行 PRAGMA optimize（让统计查询稳定命中索引）
    optimize_enabled: true

logging:
  level: "INFO"
  path: "./logs/device-link.log"
  max_size_mb: 100
  backup_count: 5

ui:
  theme: "light"
  accent_color: "#1890FF"
  font_family: "Microsoft YaHei"
  refresh_ms: 2000
  tray_notify_on_event: true
  card_border_radius: 8
  enable_animations: true
