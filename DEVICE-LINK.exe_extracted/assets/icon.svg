<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#1A2A4A"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1890FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="nodeActive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1890FF"/>
      <stop offset="100%" stop-color="#00B4FF"/>
    </linearGradient>
    <linearGradient id="nodeNormal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A6A8A"/>
      <stop offset="100%" stop-color="#6A8AAA"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>

  <!-- Connecting lines between nodes (triangle) -->
  <line x1="256" y1="100" x2="100" y2="380" stroke="#1890FF" stroke-width="4" opacity="0.5" filter="url(#glow)"/>
  <line x1="100" y1="380" x2="412" y2="380" stroke="#1890FF" stroke-width="4" opacity="0.5" filter="url(#glow)"/>
  <line x1="412" y1="380" x2="256" y2="100" stroke="#00D4FF" stroke-width="5" opacity="0.7" filter="url(#glowStrong)"/>

  <!-- Bottom-left hexagon node (normal) -->
  <polygon points="100,350 130,367 130,403 100,420 70,403 70,367" fill="none" stroke="url(#lineGrad)" stroke-width="3" opacity="0.7"/>
  <circle cx="100" cy="385" r="12" fill="url(#nodeNormal)" opacity="0.8"/>

  <!-- Bottom-right hexagon node (normal) -->
  <polygon points="412,350 442,367 442,403 412,420 382,403 382,367" fill="none" stroke="url(#lineGrad)" stroke-width="3" opacity="0.7"/>
  <circle cx="412" cy="385" r="12" fill="url(#nodeNormal)" opacity="0.8"/>

  <!-- Top hexagon node (ACTIVE - highlighted) -->
  <polygon points="256,70 296,93 296,137 256,160 216,137 216,93" fill="none" stroke="#00D4FF" stroke-width="4" filter="url(#glowStrong)"/>
  <circle cx="256" cy="115" r="18" fill="url(#nodeActive)" filter="url(#glowStrong)"/>

  <!-- Pulse ring around active node -->
  <circle cx="256" cy="115" r="28" fill="none" stroke="#00D4FF" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="115" r="38" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.15"/>

  <!-- Brand text -->
  <text x="256" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1890FF" filter="url(#glow)">DEVICE LINK</text>

  <!-- Small decorative dots on lines -->
  <circle cx="178" cy="240" r="3" fill="#00D4FF" opacity="0.6"/>
  <circle cx="334" cy="240" r="3" fill="#00D4FF" opacity="0.6"/>
  <circle cx="256" cy="330" r="3" fill="#00D4FF" opacity="0.4"/>
</svg>
